name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-test.txt
      - name: Tests
        # data/ is not in git: the tests build their database from
        # tests/fixtures/words_sample.json.
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: for f in $(find static/js -name '*.js'); do node --check "$f"; done
      - name: JavaScript tests
        # How to say it: mouth positions, the IPA reader, the word lists.
        run: node --test tests/js/*.test.mjs
