<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-ntl8uR8RlRckwROvbSKiqEpSd0ydctTVS8sFDIYzFms=' 'sha256-35TxFtkug85o3nTItqKFW9PTWZDBW6f8NhrxAZ5Su4I=' 'sha256-z/UY+UhA8uqovzIgmjjbpDSfk7ajPkO3v9x/H8m7lq4='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' blob:; font-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LexiMaster</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B47A8'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='700' fill='%23F0D48A' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="static/fonts/fonts.css">
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/app.css">
  <script>
    try {
      const t = localStorage.getItem("lexi-theme");
      if (["light", "dark", "mariana"].includes(t)) document.documentElement.dataset.theme = t;
      else if (t) localStorage.removeItem("lexi-theme");  // a theme that no longer exists
    } catch (e) {}
  </script>
  <meta name="theme-color" content="#2B47A8">
  <meta name="description" content="Vocabulary trainer for precise, professional and everyday American English, with American pronunciation and spaced repetition.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="static/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LexiMaster">
  <script>window.LEXI_STATIC = true; window.LEXI_VERSION = "20261028192959";</script>
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Sections">
      <a class="brand" href="#home" aria-label="LexiMaster home">
        <span class="brand-mark" aria-hidden="true">L</span>
        <span class="brand-name">LexiMaster</span>
      </a>
      <div class="nav-links" id="nav-links"></div>
      <div class="rail-foot">
        <button class="icon-btn" id="rail-toggle" type="button" title="Collapse the menu" aria-label="Collapse the menu" aria-expanded="true"></button>
        <button class="icon-btn" id="help-btn" type="button" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
        <a class="icon-btn" id="about-btn" href="#about" title="About LexiMaster" aria-label="About LexiMaster"></a>
      </div>
    </nav>
    <main id="view" tabindex="-1"><p class="boot-note">Loading the lexicon…</p></main>
  </div>
  <div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>
  <script type="module" src="static/js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js")
        .then(reg => { window.LEXI_SW = reg; dispatchEvent(new Event("lexi-sw")); }).catch(() => {}));
    }
  </script>
</body>
</html>
